apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-app
  namespace: mlops-exp8
  labels:
    app: iris-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-app
  template:
    metadata:
      labels:
        app: iris-app
    spec:
      containers:
        - name: iris-app
          image: iris-mlops:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Streamlit UI exposed on http://localhost:8501 (Docker Desktop maps LoadBalancer services to localhost)
apiVersion: v1
kind: Service
metadata:
  name: iris-app
  namespace: mlops-exp8
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector:
    app: iris-app
  ports:
    - name: http
      port: 8501
      targetPort: http
---
# Headless service so Prometheus can discover and scrape every pod individually
apiVersion: v1
kind: Service
metadata:
  name: iris-app-metrics
  namespace: mlops-exp8
spec:
  clusterIP: None
  selector:
    app: iris-app
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
